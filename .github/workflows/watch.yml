name: Stock watch

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 13:00-21:55 UTC.
    # Covers US market hours in both summer (13:30-20:00 UTC) and winter (14:30-21:00 UTC),
    # plus time after the close for the daily summary. GitHub may run these a few minutes late.
    - cron: "*/5 13-21 * * 1-5"
  # Redeploy the app when you change it or the settings.
  push:
    branches: [main]
    paths: ["site/**", "config.json", "stock_watch.py", ".github/workflows/watch.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [check, test]
        default: test

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python stock_watch.py --test

      - name: Check price and send alerts
        if: github.event_name == 'schedule' || inputs.mode == 'check'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python stock_watch.py --once

      - name: Build app data
        run: python stock_watch.py --app-data

      # Remember which alerts were already sent, so you don't get duplicates.
      - name: Save state
        if: github.event_name == 'schedule' || inputs.mode == 'check'
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update alert state"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
