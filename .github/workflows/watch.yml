name: Stock watch

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 05:00-22:55 UTC: covers EU broker hours (7:30-23:00 Central
    # European time, summer and winter), US pre-market, regular hours and after hours.
    - cron: "*/5 5-22 * * 1-5"
    # Once an hour the rest of the time, so news alerts also arrive at night and on weekends.
    - cron: "0 0-4,23 * * *"
    - cron: "0 5-22 * * 0,6"
    # GitHub may start scheduled runs a few minutes late.
  # Redeploy the app when you change it or the settings.
  push:
    branches: [main]
    paths: ["site/**", "config.json", "stock_watch.py", ".github/workflows/watch.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [check, test]
        default: test

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Alert memory (what was already sent, your profit level) lives in a private Actions cache,
      # not in the public repo.
      - name: Load alert memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Send test notification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUY_PRICE: ${{ secrets.BUY_PRICE }}
          SHARES: ${{ secrets.SHARES }}
          INVESTED: ${{ secrets.INVESTED }}
        run: python stock_watch.py --test

      - name: Check price, profit and news, send alerts
        if: github.event_name == 'schedule' || inputs.mode == 'check'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUY_PRICE: ${{ secrets.BUY_PRICE }}
          SHARES: ${{ secrets.SHARES }}
          INVESTED: ${{ secrets.INVESTED }}
        run: python stock_watch.py --once

      - name: Save alert memory
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # Old memory copies pile up; keep only the newest few.
      - name: Tidy old memory
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[5:][].id' \
            | xargs -r -n1 gh cache delete || true

      # GitHub pauses schedules in repos with no commits for 60 days. One tiny commit a month prevents that.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "stock-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep schedule alive"
            git push
          fi

      - name: Build app data
        run: python stock_watch.py --app-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
