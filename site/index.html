<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>TTWO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b0d10;
    --card: #14181d;
    --line: #232a31;
    --text: #eef2f5;
    --muted: #8a96a3;
    --up: #2fd47c;
    --down: #ff5c5c;
    --accent: var(--up);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px; margin: 0 auto;
    overscroll-behavior-y: contain;
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ticker { font-weight: 700; font-size: 20px; letter-spacing: .02em; }
  .name { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--card); color: var(--muted); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .badge.open i { background: var(--up); box-shadow: 0 0 8px var(--up); }

  .price { font-size: 46px; font-weight: 700; letter-spacing: -.02em; margin: 18px 0 2px; font-variant-numeric: tabular-nums; }
  .change { font-size: 16px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .change span { color: var(--muted); font-weight: 400; }

  .chart-wrap { position: relative; margin: 18px -16px 0; height: 230px; touch-action: pan-y; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tip {
    position: absolute; top: -6px; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; display: none;
    font-variant-numeric: tabular-nums;
  }
  .tip b { display: block; font-size: 14px; }

  .ranges { display: flex; gap: 6px; margin: 10px 0 20px; }
  .ranges button {
    flex: 1; padding: 9px 0; border-radius: 10px; border: 0; cursor: pointer;
    background: transparent; color: var(--muted); font: inherit; font-weight: 600;
  }
  .ranges button.on { background: var(--card); color: var(--text); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .card small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .card div { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; position: relative; }
  .bar i { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--text); transform: translateX(-50%); }

  h2 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 24px 0 10px; }
  .alerts .row { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .alerts .row + .row { border-top: 1px solid var(--line); }
  .alerts .dist { color: var(--muted); font-size: 13px; }

  .pos { padding: 14px; }
  .pos .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pos .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pos .rows small { display: block; color: var(--muted); font-size: 12px; }
  .pos .rows span { font-weight: 600; font-variant-numeric: tabular-nums; }
  .gain { color: var(--up); } .loss { color: var(--down); }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 10px 0 0; cursor: pointer; text-decoration: underline; }
  .btn { width: 100%; padding: 13px; border-radius: 12px; border: 0; font: inherit; font-weight: 600; cursor: pointer; background: var(--up); color: #062413; }
  form label { display: block; color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  form input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px; user-select: text;
  }
  form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .yourline { margin-top: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; line-height: 1.6; }
  .error { color: var(--down); }
  .skeleton { opacity: .35; }
</style>
</head>
<body class="skeleton">
  <header>
    <div style="min-width:0">
      <div class="ticker" id="ticker">TTWO</div>
      <div class="name" id="name">Take-Two Interactive</div>
    </div>
    <div class="badge" id="badge"><i></i><span>…</span></div>
  </header>

  <div class="price" id="price">–</div>
  <div class="change" id="change">&nbsp;</div>
  <div class="yourline" id="yourLine"></div>

  <div class="chart-wrap" id="chartWrap">
    <svg id="chart" preserveAspectRatio="none"></svg>
    <div class="tip" id="tip"></div>
  </div>

  <div class="ranges" id="ranges">
    <button data-r="1D" class="on">1D</button>
    <button data-r="1M">1M</button>
    <button data-r="3M">3M</button>
    <button data-r="6M">6M</button>
  </div>

  <div class="grid">
    <div class="card"><small>Day range</small><div id="dayRange">–</div><div class="bar"><i id="dayDot"></i></div></div>
    <div class="card"><small>52-week range</small><div id="yearRange">–</div><div class="bar"><i id="yearDot"></i></div></div>
    <div class="card"><small>Previous close</small><div id="prev">–</div></div>
    <div class="card"><small>USD → EUR</small><div id="fx">–</div></div>
  </div>

  <h2>Your position</h2>
  <div class="card pos" id="pos"></div>

  <h2>Your alerts</h2>
  <div class="card alerts" id="alerts"></div>

  <footer id="footer">Loading…</footer>

<script>
const $ = (id) => document.getElementById(id);
let data = null, range = "1D";

const fmtMoney = (v, cur) => v == null ? "–" :
  new Intl.NumberFormat("de-DE", { style: "currency", currency: cur || "EUR" }).format(v);
const fmtPct = (v) => (v >= 0 ? "+" : "") + v.toFixed(2).replace(".", ",") + " %";

function ago(sec) {
  const m = Math.round((Date.now() / 1000 - sec) / 60);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}

function points() {
  if (!data) return [];
  if (range === "1D") return data.intraday.length > 1 ? data.intraday : data.history.slice(-5);
  const days = { "1M": 31, "3M": 92, "6M": 183 }[range];
  const cutoff = Date.now() / 1000 - days * 86400;
  return data.history.filter(([t]) => t >= cutoff);
}

function drawChart() {
  const svg = $("chart"), pts = points();
  const W = svg.clientWidth || 360, H = svg.clientHeight || 230, padY = 14;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (pts.length < 2) { svg.innerHTML = ""; return; }

  const vals = pts.map((p) => p[1]);
  // For 1D, compare against yesterday's close; otherwise against the first point in range.
  const base = range === "1D" ? data.prev_close : vals[0];
  let lo = Math.min(...vals, base), hi = Math.max(...vals, base);
  if (hi - lo < 0.01) { hi += 1; lo -= 1; }
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (v) => padY + (1 - (v - lo) / (hi - lo)) * (H - padY * 2);

  const up = vals[vals.length - 1] >= base;
  const color = up ? "var(--up)" : "var(--down)";
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");

  svg.innerHTML = `
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${up ? "#2fd47c" : "#ff5c5c"}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${up ? "#2fd47c" : "#ff5c5c"}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="#3a444e" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <line id="cursor" y1="0" y2="${H}" stroke="#56616c" stroke-width="1" visibility="hidden"/>
    <circle id="dot" r="4.5" fill="${color}" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>`;

  svg._scale = { pts, x, y, W };
}

function scrub(clientX) {
  const s = $("chart")._scale; if (!s) return;
  const rect = $("chart").getBoundingClientRect();
  const i = Math.max(0, Math.min(s.pts.length - 1, Math.round(((clientX - rect.left) / rect.width) * (s.pts.length - 1))));
  const [t, v] = s.pts[i], cx = s.x(i), cy = s.y(v);
  const cursor = $("cursor"), dot = $("dot"), tip = $("tip");
  cursor.setAttribute("x1", cx); cursor.setAttribute("x2", cx); cursor.setAttribute("visibility", "visible");
  dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
  const d = new Date(t * 1000);
  const when = range === "1D"
    ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString([], { day: "numeric", month: "short", year: range === "6M" ? "2-digit" : undefined });
  tip.innerHTML = `<b>${fmtMoney(v, data.currency)}</b>${when}`;
  tip.style.left = Math.max(50, Math.min(rect.width - 50, (cx / s.W) * rect.width)) + "px";
  tip.style.display = "block";
  $("price").textContent = fmtMoney(v, data.currency);
}

function endScrub() {
  $("tip").style.display = "none";
  ["cursor", "dot"].forEach((id) => $(id) && $(id).setAttribute("visibility", "hidden"));
  if (data) $("price").textContent = fmtMoney(data.price, data.currency);
}

// ---- Your position: stored only on this phone (localStorage), never uploaded. ----
const POS_KEY = "ttwo-position";
const getPos = () => { try { return JSON.parse(localStorage.getItem(POS_KEY)) || null; } catch { return null; } };
const parseNum = (s) => { const n = parseFloat(String(s).trim().replace(/\s/g, "").replace(",", ".")); return isFinite(n) && n > 0 ? n : null; };
let editingPos = false;

function renderPos() {
  const el = $("pos"), pos = getPos(), cur = data ? data.currency : "EUR";
  if (editingPos || !pos) {
    const buy = pos ? String(pos.buy).replace(".", ",") : "", shares = pos && pos.shares ? String(pos.shares).replace(".", ",") : "";
    el.innerHTML = `
      <form id="posForm">
        <div class="two">
          <div><label for="buy">Buy price per share (€)</label><input id="buy" inputmode="decimal" placeholder="e.g. 192,80" value="${buy}" required></div>
          <div><label for="shares">Shares (optional)</label><input id="shares" inputmode="decimal" placeholder="e.g. 5" value="${shares}"></div>
        </div>
        <button class="btn" type="submit">Save</button>
        ${pos ? `<button class="link" type="button" id="posClear">Remove my position</button>` : ""}
        <div class="sub" style="margin-top:8px">Saved only on this phone.</div>
      </form>`;
    $("posForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const b = parseNum($("buy").value);
      if (!b) { $("buy").focus(); return; }
      localStorage.setItem(POS_KEY, JSON.stringify({ buy: b, shares: parseNum($("shares").value) }));
      editingPos = false; render();
    });
    const clear = $("posClear");
    if (clear) clear.addEventListener("click", () => { localStorage.removeItem(POS_KEY); editingPos = true; render(); });
    $("yourLine").textContent = "";
    return;
  }

  const price = data.price, per = price - pos.buy, pct = (per / pos.buy) * 100, cls = per >= 0 ? "gain" : "loss";
  const sign = (v) => (v >= 0 ? "+" : "−") + fmtMoney(Math.abs(v), cur);
  const total = pos.shares ? per * pos.shares : null;
  el.innerHTML = `
    <small style="color:var(--muted);font-size:12px">${per >= 0 ? "Profit" : "Loss"}${pos.shares ? "" : " per share"}</small>
    <div class="big ${cls}">${sign(total ?? per)} <span style="font-size:17px">(${fmtPct(pct)})</span></div>
    <div class="rows">
      <div><small>Bought at</small><span>${fmtMoney(pos.buy, cur)}</span></div>
      <div><small>Now</small><span>${fmtMoney(price, cur)}</span></div>
      ${pos.shares ? `
      <div><small>Invested</small><span>${fmtMoney(pos.buy * pos.shares, cur)}</span></div>
      <div><small>Worth now</small><span>${fmtMoney(price * pos.shares, cur)}</span></div>
      <div><small>Shares</small><span>${String(pos.shares).replace(".", ",")}</span></div>
      <div><small>Per share</small><span class="${cls}">${sign(per)}</span></div>` : ""}
    </div>
    <button class="link" id="posEdit">Edit</button>`;
  $("posEdit").addEventListener("click", () => { editingPos = true; renderPos(); });
  $("yourLine").innerHTML = `You: <span class="${cls}">${sign(total ?? per)} (${fmtPct(pct)})</span>`;
}

function setBar(dot, lo, hi, v) {
  const p = hi > lo ? ((v - lo) / (hi - lo)) * 100 : 50;
  $(dot).style.left = Math.max(0, Math.min(100, p)) + "%";
}

function render() {
  const d = data, cur = d.currency;
  document.body.classList.remove("skeleton");
  const up = d.change_pct >= 0;
  document.documentElement.style.setProperty("--accent", up ? "var(--up)" : "var(--down)");

  $("ticker").textContent = d.symbol;
  $("name").textContent = d.name;
  document.title = `${d.symbol} ${fmtMoney(d.price, cur)}`;
  $("price").textContent = fmtMoney(d.price, cur);
  $("change").innerHTML = `${up ? "▲" : "▼"} ${fmtMoney(Math.abs(d.change), cur)} (${fmtPct(d.change_pct)}) <span>today</span>`;

  $("badge").className = "badge" + (d.market_open ? " open" : "");
  $("badge").querySelector("span").textContent = d.market_open ? "Market open" : "Market closed";

  $("dayRange").textContent = `${fmtMoney(d.day_low, cur)} – ${fmtMoney(d.day_high, cur)}`;
  $("yearRange").textContent = `${fmtMoney(d.week52_low, cur)} – ${fmtMoney(d.week52_high, cur)}`;
  setBar("dayDot", d.day_low, d.day_high, d.price);
  setBar("yearDot", d.week52_low, d.week52_high, d.price);
  $("prev").textContent = fmtMoney(d.prev_close, cur);
  $("fx").textContent = d.fx.pair ? `1 $ = ${d.fx.rate.toFixed(4).replace(".", ",")} €` : "–";

  const a = d.alerts, rows = [];
  const dist = (lvl) => fmtPct(((lvl - d.price) / d.price) * 100) + " away";
  if (a.above != null) rows.push(["▲ Above", fmtMoney(a.above, cur), d.price >= a.above ? "reached" : dist(a.above)]);
  if (a.below != null) rows.push(["▼ Below", fmtMoney(a.below, cur), d.price <= a.below ? "reached" : dist(a.below)]);
  if (a.move_pct) rows.push(["Big day", "±" + String(a.move_pct).replace(".", ",") + " %", "now " + fmtPct(d.change_pct)]);
  $("alerts").innerHTML = rows.map(([k, v, s]) =>
    `<div class="row"><span>${k} <b>${v}</b></span><span class="dist">${s}</span></div>`).join("") ||
    `<div class="row dist">No alerts set</div>`;

  renderPos();
  $("footer").innerHTML = `Price from ${ago(d.market_time)} · updated ${ago(d.updated)}<br>Delayed data from Yahoo Finance · not financial advice`;
  drawChart();
}

async function load() {
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    render();
  } catch (e) {
    if (!data) $("footer").innerHTML = `<span class="error">Couldn't load prices. Check your connection.</span>`;
  }
}

$("ranges").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  range = b.dataset.r;
  document.querySelectorAll(".ranges button").forEach((x) => x.classList.toggle("on", x === b));
  drawChart();
});

const wrap = $("chartWrap");
wrap.addEventListener("pointerdown", (e) => { wrap.setPointerCapture(e.pointerId); scrub(e.clientX); });
wrap.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") scrub(e.clientX); });
wrap.addEventListener("pointerup", endScrub);
wrap.addEventListener("pointercancel", endScrub);
wrap.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") endScrub(); });
addEventListener("resize", () => data && drawChart());
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 60000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load();
</script>
</body>
</html>
